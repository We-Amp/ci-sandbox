name: release
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    # Only a tag push on this repository may run the release build on the fleet.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.repository.fork == false
    runs-on: sandbox-fleet
    steps:
      - name: Release build placeholder
        run: echo "release build for ${{ github.ref }} on ${{ runner.name }}"
